---
applications: 
- name: productmanagementapi
  random-route: true
  path: ./target/productmanagementapi-1.0.0-SNAPSHOT.jar
  memory: 1024M
  buildpacks: 
  - sap_java_buildpack_jakarta
  env:
    SPRING_PROFILES_ACTIVE: cloud
    JBP_CONFIG_SPRING_AUTO_RECONFIGURATION: '{enabled: false}'
    TARGET_RUNTIME: tomcat
    JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jdk.SAPMachineJDK']"
    JBP_CONFIG_SAP_MACHINE_JDK : "{ version: 25.+ }"
  services: 
  - tservag-solutions-dev-postgresql
  - tservag-solutions-pm-xsuaa-service
- name: approuter
  path: ./approuter
  memory: 128M
  buildpacks:
    - nodejs_buildpack
  env: 
    destinations: >
      [
        {
          "name": "destproductmanagementapi", 
          "url": "https://productmanagementapi-sweet-leopard-sb.cfapps.eu10-005.hana.ondemand.com",
          "forwardAuthToken": true
        },
        {
          "name": "destproductmanagement", 
          "url": "https://solutions-dev-uywy8uiq.launchpad.cfapps.eu10.hana.ondemand.com",
          "forwardAuthToken": false
        }
      ]
  services: 
    - tservag-solutions-pm-xsuaa-service
    - tservag-solutions-pm-html5-rt